<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyPay – Testnet</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Initialize Pi SDK
    Pi.init({ version: "2.0", sandbox: true }).then(() => {
      console.log("Pi SDK initialized");

      // Authenticate the user
      const scopes = ["username", "payments"];

      function onIncompletePaymentFound(payment) {
        console.log("Incomplete payment found:", payment);
      }

      Pi.authenticate(scopes, onIncompletePaymentFound)
        .then(function (auth) {
          console.log("User authenticated:", auth.user);
          console.log("Access Token:", auth.accessToken);
        })
        .catch(function (error) {
          console.error("Authentication error:", error);
        });
    });
  </script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    h1 { margin: 0 0 0.5rem; }
    p { color: #aaa; margin-bottom: 1.5rem; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      box-sizing: border-box;
    }
    .btn-primary { background: #007bff; }
    .btn-secondary { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MyPay</h1>
    <p>Testnet · App Verification</p>

    <a href="/terms-of-service.html" class="btn btn-primary">Terms of Service</a>
    <a href="/privacy-policy.html" class="btn btn-secondary">Privacy Policy</a>
  </div>
</body>
</html>
