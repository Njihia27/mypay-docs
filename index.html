<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPay – Testnet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: #a0a0a0;
      margin-bottom: 32px;
      font-size: 15px;
    }
    a {
      display: block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 500;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    a:hover {
      background: #1d4ed8;
    }
    a.secondary {
      background: transparent;
      border: 1px solid #333;
      color: #e0e0e0;
    }
    a.secondary:hover {
      background: #222;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>MyPay</h1>
    <p>Testnet · App Verification</p>
    
    <a href="/terms-of-service.html">Terms of Service</a>
    <a href="/privacy-policy.html" class="secondary">Privacy Policy</a>
  </div>
</body>
</html>
